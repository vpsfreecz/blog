[languages.cs]
baseURL = 'http://localhost:1313/'

[languages.en]
baseURL = 'http://localhost:1314/'

[[server.redirects]]
from = '/feed/'
to = '/feed/index.xml'
status = 200
force = true

[[server.headers]]
for = '/feed/**'
