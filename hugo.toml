title = 'vpsFree.cz blog'
defaultContentLanguage = 'cs'
timeZone = 'Europe/Prague'
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true

[languages.cs]
locale = 'cs-CZ'
label = 'Česky'
weight = 1

[languages.en]
locale = 'en'
label = 'English'
weight = 2

[outputFormats.RSS]
baseName = 'index'
path = 'feed'

[outputs]
home = ['HTML', 'RSS']
section = ['HTML']

[markup.goldmark.renderer]
unsafe = false
