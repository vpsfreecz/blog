title = 'vpsFree.cz blog'
defaultContentLanguage = 'cs'
timeZone = 'Europe/Prague'
enableRobotsTXT = true

[languages.cs]
locale = 'cs-CZ'
label = 'Česky'
weight = 1

[languages.cs.params]
piwikSiteId = 4

[languages.en]
locale = 'en'
label = 'English'
weight = 2

[languages.en.params]
piwikSiteId = 10

[outputFormats.RSS]
baseName = 'index'
path = 'feed'

[outputs]
home = ['HTML', 'RSS']
section = ['HTML']

[markup.goldmark.renderer]
unsafe = false

[taxonomies]
category = "categories"
tag = "tags"

[permalinks.term]
categories = "/category/:slug/"
tags = "/tag/:slug/"

# The imported corpus is sanitized native HTML; new articles may use Markdown.
[security]
allowContent = ['^text/html$', '^text/markdown$']

[params.discourse]
enabled = true
