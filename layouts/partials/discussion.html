{{/* The later discussion package owns production embedding and legacy comments. */}}
{{ $discussionURL := "" }}
{{ with index hugo.Data.articles .Params.article_id }}{{ $discussionURL = .discussion_url }}{{ end }}
<section id="comments" aria-label="{{ i18n "discussion" }}"{{ with $discussionURL }} data-discussion-url="{{ . }}"{{ end }}>
  <h2>{{ i18n "discussion" }}</h2>
  <p>{{ i18n "discussionDisabled" }} <a href="https://discourse.vpsfree.cz/">{{ i18n "forum" }}</a></p>
</section>
