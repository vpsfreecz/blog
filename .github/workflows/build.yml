name: Build blog
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop -c bin/check
      - run: nix develop -c bin/check-release
      - run: nix build .#site
      - name: Package trusted main build
        if: github.repository == 'vpsfreecz/blog' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_protected
        run: >-
          nix develop -c bin/package-release --site result --output release
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'vpsfreecz/blog' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_protected
        with:
          name: blog-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
