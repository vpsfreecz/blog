name: Build blog
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix develop -c bin/check
      - run: nix develop -c bin/check-release
      - run: nix build .#site
      - name: Package release
        if: (github.repository == 'vpsfreecz/blog' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_protected) || (github.repository == 'vpsfreecz/blog' && github.event_name == 'push' && github.ref == 'refs/heads/2026-11-06-multilingual-blog-migration')
        run: >-
          nix develop -c bin/package-release --site result --output release
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (github.repository == 'vpsfreecz/blog' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_protected) || (github.repository == 'vpsfreecz/blog' && github.event_name == 'push' && github.ref == 'refs/heads/2026-11-06-multilingual-blog-migration')
        with:
          name: blog-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  deploy:
    needs: build
    if: (github.repository == 'vpsfreecz/blog' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected) || (github.repository == 'vpsfreecz/blog' && github.event_name == 'push' && github.ref == 'refs/heads/2026-11-06-multilingual-blog-migration')
    runs-on: ubuntu-latest
    environment: blog-production
    concurrency:
      group: blog-production-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-${{ github.sha }}
          path: release
      - name: Upload and confirm selected release
        env:
          BLOG_DEPLOY_KEY: ${{ secrets.BLOG_DEPLOY_KEY }}
        run: nix develop -c bin/upload-release --release release
